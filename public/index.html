<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRS CIS League | Support</title><meta name="theme-color" content="#07040f">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#8b5cf6;--p2:#c4b5fd;--t:#f3eeff;--m:#a79cc9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--t);font:15px/1.5 Inter,system-ui,sans-serif;background:#07040f;background-attachment:fixed;
background-image:radial-gradient(600px 500px at 8% 0,#5b21b6aa,transparent),radial-gradient(700px 600px at 95% 25%,#7c3aed77,transparent),radial-gradient(600px 500px at 45% 105%,#4c1d95aa,transparent)}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid rgba(255,255,255,.13);box-shadow:0 8px 32px rgba(10,0,40,.35),inset 0 1px 0 rgba(255,255,255,.12);border-radius:16px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-radius:0;border-width:0 0 1px;position:sticky;top:0;z-index:5}
.brand{color:#fff;text-decoration:none;font-weight:800}.brand span{color:var(--m);font-weight:600;margin-left:10px;padding-left:12px;border-left:1px solid #fff3}
main{max-width:1100px;margin:0 auto;padding:36px 20px;min-height:70vh}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;margin:0 0 24px}h2{margin:8px 0 14px}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{padding:20px;color:inherit;text-decoration:none;position:relative;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#a78bfa;box-shadow:0 12px 40px #7c3aed55}
.card h3{margin:14px 0 4px}.card p{margin:0;color:var(--m);font-size:14px}
.ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:#8b5cf633;color:var(--p2)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ar{position:absolute;right:18px;top:20px;color:var(--m)}
.side,.pad{padding:20px}.side h4{margin:14px 0 4px}.side p{color:var(--m);margin:0 0 12px}
.me{display:flex;gap:12px;align-items:center}.me img{width:36px;height:36px;border-radius:50%;background:#8b5cf655}.me a{margin-left:auto;color:var(--m);font-size:13px}
small{color:var(--m);display:block}hr{border:0;border-top:1px solid #fff2;margin:16px 0}
.yt{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.badge{background:#8b5cf644;color:var(--p2);border-radius:99px;padding:0 9px;font-size:12px;font-weight:800}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;margin:8px 0;border-radius:10px;background:#ffffff0d;color:inherit;text-decoration:none}.row:hover{background:#8b5cf633}
.chip{font-style:normal;font-size:11px;padding:2px 9px;border-radius:99px;font-weight:800;text-transform:uppercase;background:#22c55e33;color:#86efac}.chip.closed{background:#ffffff1f;color:var(--m)}
label{display:block;font-size:12px;color:var(--m);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.07em}
input,textarea{width:100%;background:#0a061a99;border:1px solid #ffffff22;color:var(--t);border-radius:10px;padding:11px 12px;font:inherit}
input:focus,textarea:focus{outline:2px solid var(--p);border-color:transparent}textarea{min-height:110px;resize:vertical}
button,.btn{background:linear-gradient(135deg,#7c3aed,#9d6bff);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:12px 8px 0 0}
.alt{background:#ffffff1f!important}.back{color:var(--m);text-decoration:none;display:inline-block;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:12px;margin:10px 0;background:#ffffff0d;border:1px solid #ffffff10}.msg.staff{background:#8b5cf62b;border-color:#8b5cf666}.msg p{margin:4px 0 0;white-space:pre-wrap}
footer{max-width:1100px;margin:0 auto;padding:20px;display:flex;justify-content:space-between;color:var(--m);font-size:13px;border-top:1px solid #ffffff1a}footer a{color:#fff;font-weight:600;text-decoration:none}
@media(max-width:800px){.grid,.cards{grid-template-columns:1fr}}
</style></head><body>
<header class="glass bar"><a class="brand" href="#/">TRS CIS League <span>Support</span></a><span id="hdr"></span></header>
<main id="app"></main><footer><span>© 2026 TRS CIS League</span><span id="ft"></span></footer>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(u,b)=>(await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{})).json();
const I={a:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',r:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',q:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',o:'<circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/>'};
const CATS={appeal:['Appeal a moderation','Banned or muted in the league or on Discord? Ask us to review it.',I.a],report:['Report someone','Flag a player or member who broke the rules, with evidence.',I.r],question:['General question','Not sure where to go? Ask the team anything.',I.q],other:['Other','Anything that does not fit the options above.',I.o]};
let me=null,list=[];const login=()=>location.href='/api/auth?a=login';
async function load(){me=(await api('/api/auth?a=me')).user;list=me?await api('/api/tickets'):[];
 $('#hdr').innerHTML=me?'':'<a class="btn" style="margin:0" href="/api/auth?a=login">Sign in</a>';
 $('#ft').innerHTML=me&&me.staff?'<a href="#/staff">Staff panel</a>':'<a href="/api/auth?a=login">Staff login</a>';route()}
const row=t=>`<a class="row" href="#/t/${t.id}"><div><b>${E(t.subject)}</b><small>#${t.id.slice(1)} · ${CATS[t.cat][0]}${me.staff?' · '+E(t.uname):''}</small></div><i class="chip ${t.status}">${t.status}</i></a>`;
function route(){const [v,x]=location.hash.slice(2).split('/');
 if((v==='new'&&CATS[x])||v==='t'){if(!me)return login();return v==='new'?newView(x):ticketView(x)}
 if(v==='staff'&&me&&me.staff)return staffView();home()}
function home(){const mine=list.filter(t=>me&&t.uid===me.id);
 $('#app').innerHTML=`<h1>How can we help?</h1><div class="grid"><div class="cards">${Object.entries(CATS).map(([k,[n,d,i]])=>`<a class="glass card" href="#/new/${k}"><div class="ic"><svg viewBox="0 0 24 24">${i}</svg></div><svg class="ar" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><h3>${n}</h3><p>${d}</p></a>`).join('')}</div>
 <aside class="glass side">${me?`<div class="me"><img src="${me.avatar||''}" onerror="this.style.visibility='hidden'"><div><b>${E(me.name)}</b><small>Discord</small></div><a href="/api/auth?a=out">Sign out</a></div><hr><div class="yt"><b>Your tickets</b><span class="badge">${mine.length}</span></div>${mine.length?mine.map(row).join(''):'<h4>No tickets yet.</h4><p>Anything you open will show up here.</p>'}`:'<h4>Welcome</h4><p>Sign in with Discord to open and track your tickets.</p><button onclick="login()" style="margin:0">Sign in with Discord</button>'}</aside></div>`}
function newView(k){$('#app').innerHTML=`<a class="back" href="#/">← Back</a><h1>${CATS[k][0]}</h1><form class="glass pad" id="f"><label>Subject</label><input name="subject" maxlength="100" required>
 <label>${k==='report'?'Who are you reporting and what happened?':'Details'}</label><textarea name="text" maxlength="1800" required></textarea><label>Evidence link (optional)</label><input name="ev" placeholder="https://…"><button>Submit ticket</button><small id="err"></small></form>`;
 $('#f').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  const d=await api('/api/tickets',{action:'create',cat:k,subject:f.subject,text:f.text+(f.ev?`\n\nEvidence: ${f.ev}`:'')});
  if(d.id){list=await api('/api/tickets');location.hash='#/t/'+d.id}else $('#err').textContent=d.error}}
async function ticketView(id){const t=await api('/api/tickets?id='+id);if($('#r')&&$('#r').value)return;
 if(t.error){$('#app').innerHTML='<div class="glass pad">Ticket not found.</div>';return}
 $('#app').innerHTML=`<a class="back" href="#/">← Back</a><div class="glass pad"><i class="chip ${t.status}">${t.status}</i> <b>#${t.id.slice(1)}</b> · ${CATS[t.cat][0]}${me.staff?' · '+E(t.uname):''}<h2>${E(t.subject)}</h2>
 ${t.msgs.map(m=>`<div class="msg ${m.from}"><small>${m.from==='staff'?'🛡️ Staff · ':''}${E(m.name)} · ${new Date(m.at).toLocaleString()}</small><p>${E(m.text)}</p></div>`).join('')}
 ${t.status==='open'?'<textarea id="r" placeholder="Write a reply…"></textarea><button id="s">Send</button><button class="alt" id="c">Close ticket</button>':'<small>This ticket is closed.</small>'}
 ${t.url?`<a class="btn alt" href="${t.url}" target="_blank">Open in Discord</a>`:''}</div>`;
 if($('#s')){$('#s').onclick=async()=>{const text=$('#r').value;if(text.trim()){await api('/api/tickets',{action:'reply',id,text});$('#r').value='';ticketView(id)}};
  $('#c').onclick=async()=>{if(confirm('Close this ticket?')){await api('/api/tickets',{action:'close',id});list=await api('/api/tickets');ticketView(id)}}}}
let flt='open';
function staffView(){const l=list.filter(t=>flt==='all'||t.status===flt);
 $('#app').innerHTML=`<a class="back" href="#/">← Back</a><h1>Staff panel</h1><div>${['open','closed','all'].map(f=>`<button class="${f===flt?'':'alt'}" onclick="flt='${f}';staffView()">${f}</button>`).join('')}</div><div class="glass pad" style="margin-top:16px">${l.length?l.map(row).join(''):'No tickets.'}</div>`}
onhashchange=route;setInterval(async()=>{if(me&&location.hash.startsWith('#/t/'))route();if(me&&location.hash.startsWith('#/staff')){list=await api('/api/tickets');staffView()}},8000);load();
</script></body></html>
